<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拆解台語羅馬字 - 練習中</title>
<link href="https://tauhu.tw/tauhu-oo.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
<div class="practice-wrap">
  <div class="topbar">
    <button class="icon-btn back-icon" id="backBtn" aria-label="回選單" title="回選單">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 4L7 12L15 20" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="qcount" id="qcount"></div>
    <div class="topbar-right">
      <button class="icon-btn speaker-icon" id="pronounceBtn" aria-label="發音對照表" title="發音對照表">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 9.5V14.5H7L12 19V5L7 9.5H3Z" fill="#111111"/>
          <path d="M16 9C17 10.1 17 13.9 16 15" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
          <path d="M18.6 6.4C21.4 9.2 21.4 14.8 18.6 17.6" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="stage-outer">
    <div class="slide-canvas" id="canvas"></div>
  </div>
  <div class="ctrl-bar">
    <button class="ctrl-btn" id="prevBtn">上一題</button>
    <button class="ctrl-btn" id="undoBtn">上一步</button>
    <button class="ctrl-btn" id="allBtn">顯示答案</button>
    <button class="ctrl-btn primary" id="revealBtn">下一步</button>
    <button class="ctrl-btn" id="nextBtn">下一題</button>
  </div>
</div>

<div class="pronounce-overlay" id="pronounceOverlay" style="display:none;">
  <img class="pronounce-img" id="pronounceImg" alt="發音對照表">
</div>

<script src="data.js?v=13"></script>
<script src="queue.js?v=13"></script>
<script src="viewer.js?v=13"></script>
<script src="pronounce-data.js?v=13"></script>
<script>
  const questions = JSON.parse(sessionStorage.getItem('taigi_current_questions') || '[]');
  let pos = parseInt(sessionStorage.getItem('taigi_current_pos') || '0', 10);

  if (!questions.length) {
    window.location.href = 'index.html';
  }

  const canvas = document.getElementById('canvas');
  const qcount = document.getElementById('qcount');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const undoBtn = document.getElementById('undoBtn');
  const revealBtn = document.getElementById('revealBtn');
  const allBtn = document.getElementById('allBtn');
  const backBtn = document.getElementById('backBtn');
  const pronounceBtn = document.getElementById('pronounceBtn');
  const pronounceOverlay = document.getElementById('pronounceOverlay');
  const pronounceImg = document.getElementById('pronounceImg');

  const slideByIndex = new Map(SLIDES.map(s => [s.i, s]));
  let player = null;

  function fitCanvas() {
    // 物件不可溢出可顯示範圍：寬高分別依可視範圍縮放（允許非等比例變形），完全貼合、不留邊也不捲動
    const outer = document.querySelector('.stage-outer');
    const scaleX = outer.offsetWidth / 1280;
    const scaleY = outer.offsetHeight / 720;
    canvas.style.transform = `scale(${scaleX}, ${scaleY})`;
    canvas.style.left = '0px';
    canvas.style.top = '0px';
  }
  window.addEventListener('resize', fitCanvas);

  function loadSlide() {
    if (pos >= questions.length) {
      // 作答結束後不彈出提示，直接返回選單
      sessionStorage.removeItem('taigi_current_questions');
      sessionStorage.removeItem('taigi_current_pos');
      window.location.href = 'index.html';
      return;
    }
    sessionStorage.setItem('taigi_current_pos', String(pos));
    qcount.textContent = `第 ${pos + 1} / ${questions.length} 題`;
    const sd = slideByIndex.get(questions[pos]);
    player = new SlidePlayer(canvas, sd);
    prevBtn.disabled = pos === 0;
    fitCanvas();
  }

  function goNextQuestion() { pos++; loadSlide(); }
  function goPrevQuestion() { if (pos > 0) { pos--; loadSlide(); } }

  // 下一步：若本題已無下一步可顯示，改為直接跳到下一題
  function doNextStep() {
    if (!player) return;
    if (player.isDone) { goNextQuestion(); return; }
    player.revealStep();
  }
  // 上一步：若本題已無上一步可還原，改為直接回到上一題
  function doPrevStep() {
    if (!player) return;
    if (player.stepIndex <= 0) { goPrevQuestion(); return; }
    player.undoStep();
  }

  canvas.addEventListener('click', doNextStep);
  revealBtn.addEventListener('click', doNextStep);
  undoBtn.addEventListener('click', doPrevStep);
  allBtn.addEventListener('click', () => { if (player) player.revealAll(); });
  nextBtn.addEventListener('click', goNextQuestion);
  prevBtn.addEventListener('click', goPrevQuestion);
  backBtn.addEventListener('click', () => { window.location.href = 'index.html'; });

  pronounceBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!pronounceImg.src) pronounceImg.src = PRONOUNCE_IMG_B64;
    pronounceOverlay.style.display = 'flex';
  });
  // 觸擊畫面任一處即返回
  pronounceOverlay.addEventListener('click', () => { pronounceOverlay.style.display = 'none'; });

  document.addEventListener('keydown', (e) => {
    if (pronounceOverlay.style.display === 'flex') {
      if (e.code === 'Escape') pronounceOverlay.style.display = 'none';
      return;
    }
    if (e.code === 'Space') { e.preventDefault(); doNextStep(); }
    if (e.code === 'ArrowDown' || e.code === 'PageDown' || e.code === 'ArrowRight') { e.preventDefault(); doNextStep(); }
    if (e.code === 'ArrowUp' || e.code === 'PageUp' || e.code === 'ArrowLeft') { e.preventDefault(); doPrevStep(); }
  });

  let wheelLock = false;
  document.addEventListener('wheel', (e) => {
    if (pronounceOverlay.style.display === 'flex') return;
    if (wheelLock) return;
    wheelLock = true;
    setTimeout(() => { wheelLock = false; }, 250);
    if (e.deltaY > 0) doNextStep();
    else if (e.deltaY < 0) doPrevStep();
  }, { passive: true });

  loadSlide();
</script>
</body>
</html>
