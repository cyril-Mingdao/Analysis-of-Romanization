<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拆解台語羅馬字</title>
<link href="https://tauhu.tw/tauhu-oo.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
<button class="icon-btn speaker-icon" id="pronounceBtn" aria-label="發音對照表" title="發音對照表" style="position:fixed; top:10px; right:10px; z-index:20;">
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M3 9.5V14.5H7L12 19V5L7 9.5H3Z" fill="#111111"/>
    <path d="M16 9C17 10.1 17 13.9 16 15" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M18.6 6.4C21.4 9.2 21.4 14.8 18.6 17.6" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>
<div class="pronounce-overlay" id="pronounceOverlay" style="display:none;">
  <img class="pronounce-img" id="pronounceImg" alt="發音對照表">
</div>
<div class="entry-wrap">
  <h1 class="entry-title">拆解台語羅馬字</h1>
  <p class="entry-subtitle">台中明道中學 詹宗龍 製作</p>
  <div class="entry-card">
    <div class="entry-label">出題模式</div>
    <div class="count-grid" id="modeGrid">
      <button class="count-btn selected" data-mode="random">亂數</button>
      <button class="count-btn" data-mode="AA">AA</button>
      <button class="count-btn" data-mode="AAA">AAA</button>
      <button class="count-btn" data-mode="AAB">AAB</button>
      <button class="count-btn" data-mode="ABA">ABA</button>
      <button class="count-btn" data-mode="ABB">ABB</button>
      <button class="count-btn" data-mode="AABB">AABB</button>
      <button class="count-btn" data-mode="AABC">AABC</button>
      <button class="count-btn" data-mode="ABAC">ABAC</button>
      <button class="count-btn" data-mode="ABCB">ABCB</button>
      <button class="count-btn" data-mode="ABCC">ABCC</button>
      <button class="count-btn" data-mode="ABCD">ABCD</button>
    </div>
    <div class="entry-label">練習題數</div>
    <div class="count-grid" id="countGrid">
      <button class="count-btn selected" data-count="3">3 題</button>
      <button class="count-btn" data-count="5">5 題</button>
      <button class="count-btn" data-count="7">7 題</button>
      <button class="count-btn" data-count="9">9 題</button>
      <button class="count-btn" data-count="11">11 題</button>
      <button class="count-btn" data-count="all">全部</button>
    </div>
    <button class="start-btn" id="startBtn" disabled>開始練習</button>
    <div class="entry-progress" id="progressHint"></div>
  </div>
</div>

<script src="data.js?v=16"></script>
<script src="queue.js?v=16"></script>
<script src="pronounce-data.js?v=16"></script>
<script>
  const pronounceBtn = document.getElementById('pronounceBtn');
  const pronounceOverlay = document.getElementById('pronounceOverlay');
  const pronounceImg = document.getElementById('pronounceImg');
  pronounceBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!pronounceImg.src) pronounceImg.src = PRONOUNCE_IMG_B64;
    pronounceOverlay.style.display = 'flex';
  });
  pronounceOverlay.addEventListener('click', () => { pronounceOverlay.style.display = 'none'; });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Escape') pronounceOverlay.style.display = 'none';
  });

  let selected = '3';
  let selectedMode = 'random';
  const modeGrid = document.getElementById('modeGrid');
  const grid = document.getElementById('countGrid');
  const startBtn = document.getElementById('startBtn');
  startBtn.disabled = false;
  const hint = document.getElementById('progressHint');

  modeGrid.querySelectorAll('.count-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      modeGrid.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedMode = btn.dataset.mode;
      updateHint();
    });
  });

  grid.querySelectorAll('.count-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      grid.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selected = btn.dataset.count;
      startBtn.disabled = false;
    });
  });

  function updateHint() {
    const pool = poolForMode(selectedMode);
    const remaining = remainingInBag(selectedMode);
    const modeLabel = selectedMode === 'random' ? '全部' : selectedMode;
    if (remaining < pool.length) {
      hint.textContent = `「${modeLabel}」題庫尚有 ${remaining} / ${pool.length} 題尚未練習過`;
    } else {
      hint.textContent = `「${modeLabel}」題庫共 ${pool.length} 題，全部輪過一次後才會重複出題`;
    }
  }
  updateHint();

  startBtn.addEventListener('click', () => {
    if (!selected) return;
    const pool = poolForMode(selectedMode);
    const n = selected === 'all' ? pool.length : parseInt(selected, 10);
    const ids = selected === 'all' ? drawAllQuestions(selectedMode) : drawQuestions(n, selectedMode);
    sessionStorage.setItem('taigi_current_questions', JSON.stringify(ids));
    sessionStorage.setItem('taigi_current_pos', '0');
    window.location.href = 'practice.html';
  });
</script>
</body>
</html>
